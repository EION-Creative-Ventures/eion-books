# EION Books — content dashboard settings (Decap CMS)
# Sections: Books, Portfolio, Testimonials, About page, Creative Studio page, Site settings.

# ---------------------------------------------------------------
# LOGIN: Decap Turbo (approved). Editors sign in with a Turbo account.
# turbo_site_id identifies the "EION Books Dev" site in Decap Turbo.
# It is not a password: access is controlled by Turbo invitations.
backend:
  name: turbo-github
  turbo_site_id: 646399f7-3c77-4759-aa76-8b0d10a923b1
  branch: main
# ---------------------------------------------------------------

# Lets the dashboard edit files on this computer during local testing only.
local_backend: true

# Drafts -> In review -> Ready -> Publish
publish_mode: editorial_workflow

site_url: https://eion-books-dev.netlify.app
display_url: https://eion-books-dev.netlify.app
logo_url: /admin/eion-logo.svg

# Default image folder (each section below can use its own).
media_folder: public/uploads/books
public_folder: /uploads/books

collections:
  - name: books
    media_folder: /public/uploads/books
    public_folder: /uploads/books
    label: Books
    label_singular: Book
    description: Books published under the EION Books imprint. These appear on the Our Books page.
    folder: src/content/books
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [order, title]
    view_filters:
      - { label: Picture books, field: category, pattern: Picture book }
      - { label: For parents, field: category, pattern: For parents }
      - { label: "Children's books", field: category, pattern: "Children's book" }
      - { label: Anthologies, field: category, pattern: Anthology }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string, required: false, hint: "Optional. Shown under the title." }
      - { label: Author, name: author, widget: string, default: Paula Banks }
      - { label: Illustrator, name: illustrator, widget: string, required: false }
      - label: Category
        name: category
        widget: select
        options: [Picture book, For parents, "Children's book", Anthology]
        hint: Controls the filter buttons on the Our Books page.
      - { label: Series, name: series, widget: string, required: false, hint: "Optional, for example: Peyton's Journey" }
      - label: Cover image
        name: cover
        widget: image
        choose_url: false
        hint: "Upload a front cover JPG or PNG, at least 1000px wide and under 2 MB."
      - label: Cover description (for screen readers)
        name: coverAlt
        widget: string
        hint: "Example: Story Hustle book cover"
      - label: Book description
        name: description
        widget: text
        required: false
        hint: Two or three sentences for the featured book, one sentence for the others.
      - { label: Buy button text, name: buyLabel, widget: string, default: Buy the book }
      - label: Buy link
        name: buyUrl
        widget: string
        required: false
        hint: "Full web address where readers buy this book (Payhip, Amazon, etc.)"
        pattern: ['^https?://', 'Must start with https://']
      - label: Feature this book at the top of the page
        name: featured
        widget: boolean
        required: false
        default: false
        hint: Turn this on for one book only.
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first." }
      - { label: Show on the home page shelf, name: homeFeatured, widget: boolean, required: false, default: false, hint: "The first three also appear in the home page hero." }
      - { label: Show on Publishing Services, name: showOnPublishing, widget: boolean, required: false, default: false, hint: "Features this book in 'Books we've helped bring to life' on Publishing Services (up to three, in Display order)." }
      - label: Project label
        name: projectLabel
        widget: select
        required: false
        options: [EION Books Original, "Publishing & Production", "Formatting & Layout", "Formatting & Design"]
        hint: Optional. Only choose a label when EION Books' role on this book is confirmed. Leave blank if unsure.
      - { label: Home page shelf order, name: homeOrder, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first on the home page." }
      - { label: Show on website, name: published, widget: boolean, required: false, default: true, hint: "Turn off to hide this book without deleting it." }


  - name: authors
    label: Published Authors
    label_singular: Author
    description: Authors published under the EION Books imprint. They appear in Our Published Authors on the Meet Our Authors page. Link each author to their books so the Books and Authors pages stay connected.
    folder: src/content/authors
    media_folder: /public/uploads/authors
    public_folder: /uploads/authors
    create: true
    slug: "{{name}}"
    identifier_field: name
    extension: md
    format: frontmatter
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Photo, name: photo, widget: image, required: false, choose_url: false, hint: "A portrait photo, at least 600px wide, JPG or PNG under 2 MB. Only upload photos you have permission to publish." }
      - { label: Photo description (for screen readers), name: photoAlt, widget: string, required: false }
      - { label: Author of, name: authorOf, widget: string, required: false, hint: "Example: Author of The Stars That Shine for Mama, published by EION Books." }
      - { label: Biography, name: bio, widget: text, required: false }
      - label: Books by this author
        name: books
        widget: relation
        collection: books
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
        multiple: true
        required: false
        hint: Choose from the Books section. Each book then links back to this profile.
      - label: Website
        name: websiteUrl
        widget: string
        required: false
        pattern: ['^(https?://.*)?$', 'Must start with https://']
      - label: Instagram
        name: instagramUrl
        widget: string
        required: false
        pattern: ['^(https?://.*)?$', 'Must start with https://']
      - label: Facebook
        name: facebookUrl
        widget: string
        required: false
        pattern: ['^(https?://.*)?$', 'Must start with https://']
      - { label: Other link text, name: otherLinkLabel, widget: string, required: false, hint: "Example: Author newsletter" }
      - label: Other link
        name: otherLinkUrl
        widget: string
        required: false
        pattern: ['^(https?://.*)?$', 'Must start with https://']
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first." }
      - { label: Show on website, name: published, widget: boolean, required: false, default: true, hint: "Turn off to hide this profile without deleting it." }

  - name: young-authors
    label: Young Authors
    label_singular: Young author
    description: Young authors featured in an anthology. Names only. Photos are intentionally not available here, so children's photos are never saved to the public code repository. Add only names approved for public display.
    folder: src/content/young-authors
    create: true
    slug: "{{name}}"
    identifier_field: name
    extension: md
    format: frontmatter
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { label: Name (as approved for public display), name: name, widget: string, hint: "Use the name exactly as approved, for example a first name and last initial." }
      - label: Anthology
        name: anthology
        widget: relation
        collection: books
        search_fields: [title, subtitle]
        value_field: "{{slug}}"
        display_fields: ["{{title}} {{subtitle}}"]
        hint: "Choose the anthology from the Books section. For a new volume, add the book first (category: Anthology)."
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first." }
      - { label: Show on website, name: published, widget: boolean, required: false, default: true }

  - name: work
    label: Portfolio
    label_singular: Project
    description: "Client projects and website showcase. Choose where each project appears: the Our Work page, the Creative Studio website portfolio, or both. Client projects stay hidden until \"Author gave written permission\" is on."
    folder: src/content/work
    media_folder: /public/uploads/portfolio
    public_folder: /uploads/portfolio
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{category}}"
    sortable_fields: [order, title]
    view_filters:
      - { label: Creative Studio portfolio, field: showOnStudio, pattern: true }
      - { label: Our Work page, field: showOnWork, pattern: true }
      - { label: Client projects, field: projectFor, pattern: Client }
    fields:
      - { label: Project name, name: title, widget: string, hint: "Example: EION Books Shop" }
      - { label: Client or brand name, name: client, widget: string }
      - label: Project for
        name: projectFor
        widget: select
        options: [Client, EION Creative Ventures]
        default: Client
        hint: "EION Creative Ventures = one of your own brands. Client projects need written permission before they appear."
      - label: Category
        name: category
        widget: select
        options: [Custom Book Storefront, Custom Multi-Page Website, Custom Author Website, Canva Author Website, Author Website, Book Landing Page, Course Landing Page, Book Resource Hub, Launch Graphics, Author Branding, Book Production]
        hint: Shown on the project card.
      - label: Service type (for the Our Work page)
        name: type
        widget: select
        options: [Creative Studio, Author-published]
        default: Creative Studio
        hint: "Creative Studio = design work. Author-published = a book the author published with EION Publishing Services."
      - { label: Short service label, name: service, widget: string, hint: "Example: Author website, or Landing page + launch graphics" }
      - { label: Book type, name: bookType, widget: string, required: false, hint: "Optional, for example: Children's book, Devotional" }
      - { label: Short description, name: summary, widget: text, hint: "Two or three sentences: what the website is for and what it does. Describe only features that actually exist." }
      - { label: Longer description (featured projects), name: description, widget: text, required: false, hint: "Shown when the project is featured large on the Creative Studio page." }
      - label: What we built
        name: features
        widget: list
        required: false
        field: { label: Feature, name: feature, widget: string }
        hint: "One short line per feature, for example: Bookshelf filters by age and interest"
      - { label: What EION did (Our Work page), name: whatWeDid, widget: string, required: false, hint: "Shown on the featured Our Work project. Example: Formatting, cover coordination, KDP setup" }
      - label: Main screenshot (desktop)
        name: image
        widget: image
        choose_url: false
        hint: "A wide desktop screenshot, about 1600 x 900, JPG, PNG, or WEBP under 1 MB. Check that it shows no private or unfinished content."
      - { label: Main screenshot description, name: imageAlt, widget: string, hint: "Describe what the screenshot shows, for screen readers." }
      - { label: Phone screenshot, name: mobileImage, widget: image, required: false, choose_url: false, hint: "Optional. A tall phone screenshot, about 750 x 1400." }
      - { label: Phone screenshot description, name: mobileImageAlt, widget: string, required: false }
      - label: Additional screenshots
        name: gallery
        widget: list
        required: false
        summary: "{{fields.view}} · {{fields.alt}}"
        fields:
          - { label: Screenshot, name: image, widget: image, choose_url: false }
          - { label: Description, name: alt, widget: string }
          - { label: View, name: view, widget: select, options: [Desktop, Mobile], required: false, hint: "Leave blank for a desktop screenshot." }
      - label: Live website link
        name: link
        widget: string
        required: false
        pattern: ['^(https?://.*)?$', 'Must start with https://']
      - { label: Link button text, name: linkLabel, widget: string, default: Visit the live site }
      - { label: Client quote, name: quote, widget: text, required: false, hint: Optional. Shown on the featured Our Work project. }
      - { label: Quote by, name: quoteBy, widget: string, required: false, hint: "Example: Tiffany Sayles, author & EION client" }
      - { label: Show on the Our Work page, name: showOnWork, widget: boolean, required: false, default: true }
      - { label: Show in the Creative Studio website portfolio, name: showOnStudio, widget: boolean, required: false, default: false }
      - { label: Show on the home page, name: homeFeatured, widget: boolean, required: false, default: false, hint: "Up to two projects appear on the home page." }
      - { label: Feature large on the Creative Studio page, name: studioFeatured, widget: boolean, required: false, default: false, hint: "Best for one or two projects." }
      - { label: Feature at the top of the Our Work page, name: featured, widget: boolean, required: false, default: false, hint: Turn this on for one project only. }
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first." }
      - label: Author gave written permission
        name: permission
        widget: boolean
        required: false
        default: false
        hint: "Required for client projects. A client project stays hidden until this is on."
      - { label: Show on website, name: published, widget: boolean, required: false, default: true, hint: "Turn off to hide without deleting." }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    description: Client quotes shown in the "What authors say" section.
    folder: src/content/testimonials
    media_folder: /public/uploads/testimonials
    public_folder: /uploads/testimonials
    create: true
    slug: "{{name}}"
    identifier_field: name
    extension: md
    format: frontmatter
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { label: Quote, name: quote, widget: text, hint: "Use the client's exact words. No quotation marks needed." }
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string, required: false, hint: "Example: Author & EION client" }
      - { label: Photo, name: photo, widget: image, required: false, choose_url: false, hint: "Optional square photo. Without one, their initials appear." }
      - { label: Photo description, name: photoAlt, widget: string, required: false }
      - { label: Show on the home page, name: homeFeatured, widget: boolean, required: false, default: false, hint: "One testimonial appears on the home page." }
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, hint: "Lower numbers appear first." }
      - { label: Show on website, name: published, widget: boolean, required: false, default: true }

  - name: pages
    label: Pages
    description: Text and photos on individual pages.
    media_folder: /public/uploads/about
    public_folder: /uploads/about
    files:
      - name: our-books
        label: Our Books page
        file: src/content/pages/our-books.yaml
        format: yml
        fields:
          - { label: "Hero: small heading", name: heroEyebrow, widget: string }
          - { label: "Hero: headline", name: heroTitle, widget: string }
          - { label: "Hero: headline (gold part)", name: heroAccent, widget: string, required: false }
          - { label: "Introduction paragraphs", name: intro, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - { label: "Shelf: small heading", name: shelfEyebrow, widget: string }
          - { label: "Shelf: heading", name: shelfTitle, widget: string }
          - { label: "Closing band: heading", name: bandTitle, widget: string }
          - { label: "Closing band: text", name: bandText, widget: string, required: false }
          - { label: "Closing band: button", name: bandButton, widget: string }
      - name: publishing-services
        label: Publishing Services page
        file: src/content/pages/publishing-services.yaml
        format: yml
        fields:
          - { label: "Hero: small heading", name: heroEyebrow, widget: string }
          - { label: "Hero: headline", name: heroTitle, widget: string }
          - { label: "Hero: headline (gold part)", name: heroAccent, widget: string, required: false }
          - { label: "Hero: intro", name: heroIntro, widget: text }
          - { label: "Hero: button", name: heroButton, widget: string }
          - { label: "Model: small heading", name: modelEyebrow, widget: string }
          - { label: "Model: heading", name: modelHeading, widget: string }
          - { label: "Model: text", name: modelText, widget: text, hint: "Describe the standard author-owned model. Don't offer the EION Books imprint as a client package." }
          - { label: "Table: left column title", name: youKeepLabel, widget: string }
          - { label: "Table: right column title", name: weProvideLabel, widget: string }
          - { label: "Table: You keep", name: youKeep, widget: list, field: { label: Item, name: item, widget: string } }
          - { label: "Table: EION Books provides", name: weProvide, widget: list, field: { label: Item, name: item, widget: string } }
          - { label: "Table: note", name: modelNote, widget: string, required: false, hint: "Example: Services depend on your selected package or individual service agreement." }
          - { label: "Phases: small heading", name: phasesEyebrow, widget: string }
          - { label: "Phases: heading", name: phasesHeading, widget: string }
          - label: "Phases"
            name: phases
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Phase name, name: title, widget: string }
              - { label: Services, name: items, widget: list, field: { label: Service, name: item, widget: string } }
          - { label: "Phases: note", name: phasesNote, widget: string, required: false }
          - { label: "Ways to work: small heading", name: waysEyebrow, widget: string }
          - { label: "Ways to work: heading", name: waysHeading, widget: string }
          - label: "Ways to work: cards"
            name: ways
            widget: list
            summary: "{{fields.title}}"
            hint: Do not add prices until packages are final.
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Link text, name: linkText, widget: string }
              - { label: Highlight label, name: highlight, widget: string, required: false, hint: "Optional, for example: MOST COMPLETE. Fills the card in gold." }
          - { label: "Ways to work: note", name: waysNote, widget: string, required: false }
          - { label: "Books section: small heading", name: booksEyebrow, widget: string }
          - { label: "Books section: heading", name: booksHeading, widget: string, hint: "Shows up to three books with 'Show on Publishing Services' on, in Display order." }
          - { label: "Books section: text", name: booksText, widget: text, required: false }
          - { label: "Books section: link text", name: booksLinkText, widget: string, required: false }
          - { label: "Questions: small heading", name: faqEyebrow, widget: string }
          - { label: "Questions: heading", name: faqHeading, widget: string }
          - label: "Questions and answers"
            name: faqs
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }
          - { label: "Closing: heading", name: closingHeading, widget: string }
          - { label: "Closing: button", name: closingButton, widget: string }
      - name: home
        label: Home page
        file: src/content/pages/home.yaml
        format: yml
        fields:
          - { label: "Hero: small heading", name: heroEyebrow, widget: string }
          - { label: "Hero: headline (first line)", name: heroTitle, widget: string }
          - { label: "Hero: headline (gold line)", name: heroAccent, widget: string, required: false }
          - { label: "Hero: intro", name: heroIntro, widget: text }
          - { label: "Hero: main button", name: heroButton, widget: string }
          - { label: "Hero: second button", name: heroSecondButton, widget: string }
          - { label: "Hero: shelf caption", name: shelfCaption, widget: string, required: false, hint: "The books in the hero are the first three on the home page shelf (set in Books)." }
          - label: "Your book stays yours"
            name: ownership
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: "Services: small heading", name: servicesEyebrow, widget: string }
          - { label: "Services: heading", name: servicesHeading, widget: string }
          - label: Publishing Services card
            name: publishingCard
            widget: object
            fields: &cardfields
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Bullet points, name: items, widget: list, field: { label: Point, name: item, widget: string } }
              - { label: Link text, name: linkText, widget: string }
          - label: Creative Studio card
            name: studioCard
            widget: object
            fields: *cardfields
          - { label: "Founder: small heading", name: founderEyebrow, widget: string }
          - { label: "Founder: quote", name: founderQuote, widget: text }
          - { label: "Founder: name", name: founderName, widget: string }
          - { label: "Founder: role", name: founderRole, widget: string, required: false }
          - { label: "Founder: link text", name: founderLinkText, widget: string, required: false }
          - { label: "Founder: photo", name: founderPhoto, widget: image, required: false, choose_url: false }
          - { label: "Founder: photo description", name: founderPhotoAlt, widget: string, required: false }
          - { label: "Books shelf: small heading", name: booksEyebrow, widget: string }
          - { label: "Books shelf: heading", name: booksHeading, widget: string, hint: "Choose which books appear in Books, with 'Show on the home page shelf'." }
          - { label: "Books shelf: Our Books link text", name: booksLinkText, widget: string }
          - { label: "Books shelf: authors link text", name: authorsLinkText, widget: string, required: false }
          - { label: "Our work: small heading", name: workEyebrow, widget: string }
          - { label: "Our work: heading", name: workHeading, widget: string, hint: "Choose projects in Portfolio and the quote in Testimonials, with 'Show on the home page'." }
          - { label: "Our work: link text", name: workLinkText, widget: string }
          - { label: "How it works: small heading", name: howEyebrow, widget: string }
          - { label: "How it works: heading", name: howHeading, widget: string }
          - label: "How it works: steps"
            name: steps
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: "Who we work with: small heading", name: whoEyebrow, widget: string }
          - { label: "Who we work with: text", name: whoText, widget: text }
          - { label: "Who we work with: examples", name: whoItems, widget: list, field: { label: Example, name: item, widget: string } }
          - { label: "Who we work with: button", name: whoButton, widget: string, required: false }
          - { label: "Studio band: small heading", name: studioBandEyebrow, widget: string }
          - { label: "Studio band: headline start", name: studioBandTitle, widget: string }
          - { label: "Studio band: headline gold word", name: studioBandAccent, widget: string, required: false }
          - { label: "Studio band: headline end", name: studioBandTitleEnd, widget: string, required: false }
          - { label: "Studio band: text", name: studioBandText, widget: text }
          - { label: "Studio band: button", name: studioBandButton, widget: string }
          - { label: "Studio band: screenshot", name: studioBandImage, widget: image, choose_url: false }
          - { label: "Studio band: screenshot description", name: studioBandImageAlt, widget: string }
          - { label: "Closing: heading", name: closingHeading, widget: string }
          - { label: "Closing: text", name: closingText, widget: text }
          - { label: "Closing: button", name: closingButton, widget: string }
      - name: about
        label: About page
        file: src/content/pages/about.md
        fields:
          - { label: Small heading, name: heroEyebrow, widget: string }
          - { label: Headline, name: heroTitle, widget: string }
          - { label: Headline ending (in gold), name: heroAccent, widget: string, required: false }
          - { label: Intro, name: heroIntro, widget: text }
          - { label: Our Story heading, name: storyHeading, widget: string }
          - { label: Our Story, name: body, widget: markdown, buttons: [bold, italic, link], editor_components: [], hint: "Leave a blank line between paragraphs." }
          - label: What we believe
            name: beliefs
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: Founder name, name: founderName, widget: string }
          - { label: Founder bio, name: founderBio, widget: text }
          - { label: Experience and credentials, name: credentials, widget: text, required: false, hint: Optional second paragraph. }
          - { label: Headshot, name: headshot, widget: image, choose_url: false }
          - { label: Headshot description, name: headshotAlt, widget: string }
          - label: Your author website link
            name: authorSiteUrl
            widget: string
            required: false
            hint: Adds a button under your bio.
            pattern: ['^(https?://.*)?$', 'Must start with https://']
          - label: LitKids Create link
            name: litkidsUrl
            widget: string
            required: false
            pattern: ['^(https?://.*)?$', 'Must start with https://']

  - name: studio
    label: Creative Studio page
    description: Headlines, services, and section text on the Creative Studio page. Portfolio projects are managed in Portfolio.
    media_folder: /public/uploads/portfolio
    public_folder: /uploads/portfolio
    files:
      - name: creative-studio
        label: Creative Studio page
        file: src/content/pages/creative-studio.yaml
        format: yml
        fields:
          - { label: "Hero: small heading", name: heroEyebrow, widget: string }
          - { label: "Hero: headline", name: heroTitle, widget: string }
          - { label: "Hero: intro", name: heroIntro, widget: text }
          - { label: "Hero: main button", name: heroButton, widget: string }
          - { label: "Hero: second button", name: heroSecondButton, widget: string }
          - { label: "Hero: desktop screenshot", name: heroImage, widget: image, choose_url: false }
          - { label: "Hero: desktop screenshot description", name: heroImageAlt, widget: string }
          - { label: "Hero: phone screenshot", name: heroPhoneImage, widget: image, required: false, choose_url: false }
          - { label: "Hero: phone screenshot description", name: heroPhoneImageAlt, widget: string, required: false }
