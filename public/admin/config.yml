  - name: settings
    label: Site settings
    description: Contact details, links, and footer text used across the whole site.
    files:
      - name: site
        label: Site settings
        file: src/content/settings/site.yaml
        format: yml
        fields:
          - label: Contact email
            name: contactEmail
            widget: string
            required: false
            hint: Shown in the footer. Also used for the Start Your Project button if no form link is set.
            pattern: ['^([^@\s]+@[^@\s]+\.[^@\s]+)?$', 'Enter a valid email address']
          - label: Start Your Project link
            name: startProjectUrl
            widget: string
            required: false
            hint: Where every Start Your Project button goes (your intake form). Leave blank to use the contact email.
            pattern: ['^(https?://.*)?$', 'Must start with https://']
          - { label: Footer tagline, name: footerTagline, widget: string, required: false }
          - { label: Footer description, name: footerBlurb, widget: text, required: false }
          - label: Instagram link
            name: instagramUrl
            widget: string
            required: false
            pattern: ['^(https?://.*)?$', 'Must start with https://']
          - label: LinkedIn link
            name: linkedinUrl
            widget: string
            required: false
            pattern: ['^(https?://.*)?$', 'Must start with https://']
          - label: Facebook link
            name: facebookUrl
            widget: string
            required: false
            pattern: ['^(https?://.*)?$', 'Must start with https://']
          - label: Privacy policy link
            name: privacyUrl
            widget: string
            required: false
            pattern: ['^(https?://.*)?$', 'Must start with https://']
