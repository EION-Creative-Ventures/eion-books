faqEyebrow: QUESTIONS AUTHORS ASK
faqHeading: Good questions. Straight answers.
faqs:
  - question: Who owns my book?
    answer: You do. You keep copyright ownership and creative control of your original work.
  - question: Who receives the royalties?
    answer: You do, directly through your own publishing accounts. EION Books does not take a percentage of royalties under our standard publishing services.
  - question: Do I need my own Amazon KDP or IngramSpark account?
    answer: Yes. Your publishing accounts stay yours, and we provide setup and publishing assistance according to the services you choose.
  - question: Who provides the ISBN?
    answer: You can purchase your own ISBN or choose an eligible platform-provided ISBN. We'll guide you based on your publishing and distribution goals.
  - question: What should I know about ISBNs?
    answer: In the United States, you can buy your own ISBNs from Bowker. An ISBN you own can show your own publishing imprint and gives you more independence across platforms. Some platforms offer free ISBNs for eligible formats, but these usually come with restrictions and can't simply be moved to another platform. Different formats and editions, like a paperback and a hardcover, may each need their own ISBN. As part of your contracted services, we can guide you through choosing, purchasing, assigning, and setting up your ISBNs.
  - question: Can EION Books help with just one part of my project?
    answer: Yes. We offer individual services as well as comprehensive publishing support.
  - question: Will my book be published under the EION Books imprint?
    answer: Our standard publishing services are designed for independent, author-owned publishing. You publish with your own publishing information or an eligible platform-provided ISBN, rather than under the EION Books imprint.

