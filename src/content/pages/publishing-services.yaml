modelEyebrow: HOW OUR MODEL WORKS
modelHeading: Your book stays yours. We do the work.
modelText: You publish independently through your own Amazon KDP and IngramSpark accounts. You keep the copyright to your work, and your royalties are paid directly to you by the platforms. EION Books is paid for the services we provide, not through a percentage of your royalties.
