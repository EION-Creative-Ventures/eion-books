ownership:
  - title: Your rights.
    text: "Your book stays yours: the words, the art, and every decision about it."
  - title: Your accounts.
    text: You publish through your own Amazon KDP, IngramSpark, or other accounts. We set them up with you.
  - title: Your royalties.
    text: Platforms pay you directly. EION Books charges for the services we provide, not a percentage of your royalties.

