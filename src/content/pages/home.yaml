howHeading: From first conversation to launch day.
steps:
  - title: Consult
    text: Tell us about your book and your goals. We'll recommend the right level of support.
  - title: Plan
    text: "You get a clear plan: the services, the steps, and the decisions you'll make along the way."
  - title: Produce
    text: We coordinate editing, illustration, layout, and cover so every file is ready for print.
  - title: Publish & Launch
    text: We help you set up your book in your own KDP or IngramSpark account and prepare for launch.

