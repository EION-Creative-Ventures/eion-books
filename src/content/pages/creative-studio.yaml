dashboardEyebrow: SELF-EDITING DASHBOARD
dashboardHeading: Your website, your content, your control.
dashboardText: With an optional self-editing dashboard, you can update your books, biography, images, and other selected content without touching a line of code. Available with eligible custom website projects.
dashboardPoints:
  - title: You edit
    text: Books, bio, photos, links, and other selected content, with drafts you can review before they go live.
  - title: We handle
    text: Redesigns, new pages, and technical work.
  - title: Prefer help?
    text: Ask about monthly website care or one-time updates.
dashboardNote: Custom websites are hosted on Netlify, in accounts you own.
dashboardImage: /uploads/portfolio/dashboard.webp
